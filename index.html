<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro Video</title>
  <style>
    /* Reset margins and set background */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Fullscreen video styling */
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
    }

    /* Fallback redirect button */
    .skip-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .skip-btn:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Replace 'your-video.mp4' with the actual path or URL of your 7-second video -->
    <video id="introVideo" autoplay muted playsinline>
      <source src="intro.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    
  </div>

  <script>
    const video = document.getElementById('introVideo');
    const targetPage = 'index2.html';

    // Method 1: Redirect when video naturally reaches its end
    video.addEventListener('ended', function() {
      window.location.href = targetPage;
    });

    // Method 2: Fallback 7-second timer (in case video fails to fire 'ended')
    setTimeout(function() {
      window.location.href = targetPage;
    }, 7000); // 7000 ms = 7 seconds
  </script>

</body>
</html>
